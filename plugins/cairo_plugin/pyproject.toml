[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "add-it-all-cairo-plugin"
version = "0.1.0"
description = "CAIRO (TPRM) vendor and application connector for add-it-all."
requires-python = ">=3.11"
dependencies = ["add-it-all", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.2", "respx>=0.21"]

# Registered under the same entry-point group core already scans, so
# nothing in src/add_it_all/ changed to add this connector.
[project.entry-points."add_it_all.plugins"]
cairo = "cairo_plugin.plugin:CairoPlugin"

[tool.setuptools.packages.find]
where = ["."]
include = ["cairo_plugin*"]
