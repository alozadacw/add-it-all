[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "add-it-all-okta-plugin"
version = "0.1.0"
description = "Okta account-status connector for add-it-all."
requires-python = ">=3.11"
dependencies = ["add-it-all", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.2", "respx>=0.21"]

# Registered under the same entry-point group core already scans, so
# nothing in src/add_it_all/ changed to add this connector.
[project.entry-points."add_it_all.plugins"]
okta = "okta_plugin.plugin:OktaPlugin"

[tool.setuptools.packages.find]
where = ["."]
include = ["okta_plugin*"]
