[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "add-it-all-jamf-plugin"
version = "0.1.0"
description = "Jamf Pro hardware inventory connector for Add-IT-ALL."
requires-python = ">=3.11"
dependencies = ["add-it-all", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.2", "respx>=0.21"]

# Registered under the same entry-point group core already scans, so
# nothing in src/add_it_all/ changed to add this connector.
[project.entry-points."add_it_all.plugins"]
jamf = "jamf_plugin.plugin:JamfPlugin"

[tool.setuptools.packages.find]
where = ["."]
include = ["jamf_plugin*"]
